<!doctype html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>XOLZ</title>
</head>
<body style="margin:0;background:#000;overflow:hidden">
	<canvas id="canvas" style="display:block;touch-action:none" oncontextmenu="event.preventDefault()"></canvas>
	<script src="odin.js"></script>
	<script>
		const mem = new odin.WasmMemoryInterface();
		mem.setIntSize(4);
		const odinImports = odin.setupDefaultImports(mem);

		var Module = {
			canvas: document.getElementById("canvas"),
			instantiateWasm(imports, done) {
				WebAssembly.instantiateStreaming(fetch("index.wasm"), { ...odinImports, ...imports })
					.then(({ instance }) => {
						mem.setExports(instance.exports);
						mem.setMemory(instance.exports.memory);
						done(instance);
					});
				return {};
			},
			onRuntimeInitialized() {
				const e = wasmExports;
				e._start();
				e.main_start();
				window.dispatchEvent(new Event("resize"));
				const tick = () => { e.main_update(); requestAnimationFrame(tick); };
				requestAnimationFrame(tick);
			},
		};

		const unlockAudio = () => {
			window.miniaudio?.unlock();
			document.removeEventListener("keydown", unlockAudio, true);
			document.removeEventListener("touchend", unlockAudio, true);
		};
		document.addEventListener("keydown", unlockAudio, true);
		document.addEventListener("touchend", unlockAudio, true);
	</script>
	{{{ SCRIPT }}}
</body>
</html>
